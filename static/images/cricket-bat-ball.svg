<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="duoDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#duoDropShadow)">
    <!-- Diagonal Cricket Bat -->
    <g transform="translate(130, 20) rotate(35) scale(0.65)">
      <!-- Blade Wood -->
      <path d="M73 102 C62 103, 50 112, 48 126 L45 258 C45 272, 54 282, 65 284 L95 284 C106 282, 115 272, 115 258 L112 126 C110 112, 98 103, 87 102 Z" fill="#ddaa63" stroke="#784818" stroke-width="2" />
      <path d="M80 103 L80 284" stroke="rgba(255, 255, 255, 0.5)" stroke-width="3" />
      <path d="M71.5 16 L70 94 Q70 100 73 104 L87 104 Q90 100 90 94 L88.5 16 Z" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
      <!-- Rubber Grip bands -->
      <line x1="72" y1="35" x2="88" y2="35" stroke="#f8fafc" stroke-width="2" opacity="0.4" />
      <line x1="71" y1="55" x2="88" y2="55" stroke="#f8fafc" stroke-width="2" opacity="0.4" />
      <line x1="70" y1="75" x2="89" y2="75" stroke="#f8fafc" stroke-width="2" opacity="0.4" />
      <!-- Bat Sticker -->
      <path d="M53 126 Q80 138 107 126 L108 142 Q80 156 52 142 Z" fill="#dc2626" />
      <path d="M58 150 Q80 162 102 150 L103 192 Q80 206 57 192 Z" fill="#b91c1c" />
      <text x="80" y="176" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9" fill="#fef08a" text-anchor="middle">PRO</text>
      <!-- Toe Guard -->
      <path d="M45 264 C45 276, 54 286, 65 288 L95 288 C106 286, 115 276, 115 264 Z" fill="#18181b" />
    </g>

    <!-- Foreground Cricket Ball -->
    <g transform="translate(135, 140) scale(0.55)">
      <circle cx="100" cy="100" r="88" fill="#be123c" stroke="#4c0519" stroke-width="3" />
      <path d="M38 38 C 70 65, 130 135, 162 162" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
      <!-- Seam cross stitches -->
      <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
        <line x1="47" y1="54" x2="55" y2="47" />
        <line x1="66" y1="74" x2="75" y2="66" />
        <line x1="88" y1="96" x2="97" y2="88" />
        <line x1="111" y1="119" x2="120" y2="111" />
        <line x1="135" y1="142" x2="144" y2="134" />
        <line x1="151" y1="158" x2="160" y2="150" />
      </g>
      <!-- Specular Highlight -->
      <ellipse cx="68" cy="62" rx="30" ry="18" fill="#ffffff" opacity="0.45" transform="rotate(-30 68 62)" />
    </g>
  </g>
</svg>
